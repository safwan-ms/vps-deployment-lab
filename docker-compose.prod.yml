services:
  api:
    image: safwax/pulse-note-backend:latest
    container_name: pulse-note-backend
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "5000:5000"

  client:
    image: safwax/pulse-note-frontend:latest
    container_name: pulse-note-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
